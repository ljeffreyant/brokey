name: Deploy web preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Serve under /<repo name>
        run: node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('app.json','utf8'));a.expo.experiments={...(a.expo.experiments||{}),baseUrl:'/'+process.env.GITHUB_REPOSITORY.split('/')[1]};fs.writeFileSync('app.json',JSON.stringify(a,null,2))"
      - name: Build web
        run: npm run build:web
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
      - name: Add the store pages (privacy, terms, support) under /site
        run: |
          npm run site
          cp -r site dist/site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
